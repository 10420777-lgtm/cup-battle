<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cup Battle: Carnival Clash</title>
<style>
html,body{margin:0;height:100%;background:#171522;color:#fff;font-family:Georgia,serif;overflow:hidden}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(1100px,100vw);aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block;background:#566078;image-rendering:auto;border:4px solid #111;box-sizing:border-box}
#help{position:absolute;left:14px;bottom:10px;font:700 14px Arial;color:#fff;text-shadow:2px 2px #000}
#msg{position:absolute;inset:0;display:none;place-items:center;background:#0008;text-align:center}
#msg h1{font-size:52px;margin:0 0 10px}
#msg p{font:700 20px Arial}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="1280" height="720"></canvas>
<div id="help">A/D o ←/→ mover · ESPACIO saltar · J disparar · P pausa · R reiniciar</div>
<div id="msg"><div><h1 id="mt"></h1><p id="mp"></p></div></div>
</div>
<script>
const c=document.querySelector("canvas"),ctx=c.getContext("2d");
const W=c.width,H=c.height;
const keys={}; addEventListener("keydown",e=>{keys[e.code]=true;if(["Space","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault(); if(e.code==="KeyR")reset();});
addEventListener("keyup",e=>keys[e.code]=false);

let player,boss,shots,enemyShots,particles,state,score,spawnTimer,fireCooldown,paused;
const img=new Image(); img.src="boss_battle.png";

function reset(){
 player={x:150,y:590,vx:0,vy:0,w:58,h:78,hp:3,onGround:true,inv:0};
 boss={x:1040,y:250,hp:100,t:0,phase:0};
 shots=[];enemyShots=[];particles=[];score=0;spawnTimer=0;fireCooldown=0;paused=false;state="play";
 document.querySelector("#msg").style.display="none";
}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function puff(x,y,n=8){
 for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:30+Math.random()*20});
}
function shoot(){
 if(fireCooldown>0)return;
 shots.push({x:player.x+55,y:player.y+32,vx:12,r:8});
 fireCooldown=9;puff(player.x+55,player.y+32,3);
}
function damagePlayer(){
 if(player.inv>0)return;
 player.hp--;player.inv=70;puff(player.x+30,player.y+35,16);
 if(player.hp<=0){state="lose";show("KNOCKOUT!","Presiona R para volver a intentar");}
}
function show(a,b){document.querySelector("#mt").textContent=a;document.querySelector("#mp").textContent=b;document.querySelector("#msg").style.display="grid";}
function update(){
 if(state!=="play"||paused)return;
 if(keys.KeyP){paused=true;show("PAUSA","Presiona P para continuar");}
 player.vx=0;
 if(keys.KeyA||keys.ArrowLeft)player.vx=-5;
 if(keys.KeyD||keys.ArrowRight)player.vx=5;
 if((keys.Space||keys.ArrowUp)&&player.onGround){player.vy=-12;player.onGround=false}
 if(keys.KeyJ||keys.KeyK)shoot();
 player.x=Math.max(25,Math.min(1180,player.x+player.vx));
 player.vy+=.55;player.y+=player.vy;
 if(player.y>=590){player.y=590;player.vy=0;player.onGround=true}
 if(player.inv>0)player.inv--; if(fireCooldown>0)fireCooldown--;

 boss.t++;
 if(boss.t%150===0)boss.phase=(boss.phase+1)%3;
 spawnTimer++;
 if(spawnTimer>55){spawnTimer=0;
   let sx=boss.x-20, sy=boss.y+70;
   let dx=player.x-sx,dy=player.y-sy,len=Math.hypot(dx,dy)||1;
   let speed=5.3+(100-boss.hp)*.015;
   enemyShots.push({x:sx,y:sy,vx:dx/len*speed,vy:dy/len*speed,r:12,type:boss.phase});
 }
 for(const s of shots){s.x+=s.vx}
 for(const e of enemyShots){e.x+=e.vx;e.y+=e.vy}
 for(let i=shots.length-1;i>=0;i--){
   if(shots[i].x>W+30){shots.splice(i,1);continue}
   const s=shots[i], b={x:boss.x-70,y:boss.y-65,w:140,h:130};
   if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){
     boss.hp--;score+=10;puff(s.x,s.y,5);shots.splice(i,1);
     if(boss.hp<=0){state="win";show("BOSS DEFEATED!","Puntuación: "+score+" · Presiona R para jugar otra vez")}
   }
 }
 for(let i=enemyShots.length-1;i>=0;i--){
   const e=enemyShots[i];
   if(e.x<-50||e.x>W+50||e.y<-50||e.y>H+50){enemyShots.splice(i,1);continue}
   const pr={x:player.x,y:player.y,w:player.w,h:player.h};
   if(Math.hypot(e.x-(player.x+29),e.y-(player.y+39))<e.r+25){damagePlayer();enemyShots.splice(i,1)}
 }
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--;if(p.life<=0)particles.splice(i,1)}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // retro background
 ctx.fillStyle="#58627a";ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.8;
 for(let i=0;i<8;i++){ctx.fillStyle=i%2?"#c48d8b":"#d9c18c";ctx.beginPath();ctx.arc(90+i*165,250+Math.sin(i)*35,65,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 ctx.fillStyle="#78614c";ctx.fillRect(0,610,W,110);
 for(let x=0;x<W;x+=80){ctx.strokeStyle="#4b3b32";ctx.beginPath();ctx.moveTo(x,610);ctx.lineTo(x+20,720);ctx.stroke()}
 // decorative banners
 for(let x=0;x<W;x+=70){ctx.fillStyle=x%140?"#a84f58":"#e2c16c";ctx.beginPath();ctx.moveTo(x,80);ctx.lineTo(x+35,115);ctx.lineTo(x+70,80);ctx.fill()}
 // boss
 ctx.save();ctx.translate(boss.x,boss.y);ctx.scale(1+Math.sin(boss.t/10)*.025,1+Math.sin(boss.t/12)*.025);
 ctx.fillStyle="#9b4a45";ctx.fillRect(-65,55,130,60);
 ctx.fillStyle="#e3bf63";ctx.fillRect(-65,55,130,8);
 ctx.strokeStyle="#201c24";ctx.lineWidth=8;ctx.strokeRect(-65,55,130,60);
 ctx.fillStyle="#d6d6d0";ctx.beginPath();ctx.arc(0,-5,67,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle="#a84445";ctx.beginPath();ctx.arc(30,-20,43,0,7);ctx.fill();
 ctx.fillStyle="#e8cf67";ctx.beginPath();ctx.ellipse(-22,-15,12,22,0,0,7);ctx.ellipse(24,-15,12,22,0,0,7);ctx.fill();
 ctx.fillStyle="#171522";ctx.beginPath();ctx.arc(-20,-10,5,0,7);ctx.arc(25,-10,5,0,7);ctx.fill();
 ctx.fillStyle="#d34c4b";ctx.beginPath();ctx.arc(0,15,15,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,35,38,0,Math.PI);ctx.fill();
 ctx.strokeStyle="#171522";ctx.stroke();
 ctx.restore();
 // player (simple original cartoon hero)
 ctx.save(); if(player.inv%2===0)ctx.globalAlpha=.45;
 ctx.fillStyle="#f3f0df";ctx.beginPath();ctx.arc(player.x+29,player.y+20,28,0,7);ctx.fill();ctx.strokeStyle="#171522";ctx.lineWidth=7;ctx.stroke();
 ctx.fillStyle="#b94143";ctx.fillRect(player.x+8,player.y+43,42,28);
 ctx.fillStyle="#fff";ctx.fillRect(player.x+24,player.y-5,10,24);
 ctx.strokeStyle="#171522";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(player.x+29,player.y-3);ctx.quadraticCurveTo(player.x+42,player.y-20,player.x+53,player.y-4);ctx.stroke();
 ctx.fillStyle="#171522";ctx.beginPath();ctx.arc(player.x+18,player.y+18,4,0,7);ctx.arc(player.x+39,player.y+18,4,0,7);ctx.fill();
 ctx.fillStyle="#8a5a35";ctx.fillRect(player.x,player.y+67,25,11);ctx.fillRect(player.x+34,player.y+67,25,11);
 ctx.restore();
 // projectiles
 for(const s of shots){ctx.fillStyle="#7fe7ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
 for(const e of enemyShots){ctx.fillStyle=e.type===1?"#e85b5b":"#f1d36b";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.strokeStyle="#241d27";ctx.lineWidth=3;ctx.stroke()}
 for(const p of particles){ctx.fillStyle="#fff";ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1}
 // HUD
 ctx.fillStyle="#171522";ctx.fillRect(20,18,300,48);ctx.fillStyle="#fff";ctx.font="bold 28px Georgia";ctx.fillText("HP.",32,51);
 for(let i=0;i<3;i++){ctx.fillStyle=i<player.hp?"#d84d50":"#555";ctx.beginPath();ctx.arc(100+i*42,42,14,0,7);ctx.fill()}
 ctx.fillStyle="#fff";ctx.font="bold 20px Arial";ctx.fillText("BOSS",1000,35);
 ctx.fillStyle="#222";ctx.fillRect(1000,45,230,18);ctx.fillStyle="#d84d50";ctx.fillRect(1000,45,230*(boss.hp/100),18);
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();loop();
addEventListener("keydown",e=>{if(e.code==="KeyP"&&paused){paused=false;document.querySelector("#msg").style.display="none"}});
</script>
</body>
</html>
